<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugin Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#1a1f2e'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .plugin-card { transition: all 0.15s ease; }
    .plugin-card:hover { transform: translateY(-2px); }
    .tag { transition: all 0.1s ease; }
    .detail-panel { transition: transform 0.2s ease, opacity 0.2s ease; }

    /* Custom Select Dropdown Styling */
    .custom-select {
      position: relative;
      cursor: pointer;
    }
    .custom-select-trigger {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .custom-select-trigger:hover {
      border-color: #3b82f6;
    }
    .custom-select-trigger.open {
      border-color: #3b82f6;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }
    .custom-select-arrow {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid #94a3b8;
      transition: transform 0.2s ease;
    }
    .custom-select-trigger.open .custom-select-arrow {
      transform: rotate(180deg);
    }
    .custom-select-options {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-top: none;
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }
    .custom-select-options.open {
      display: block;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .custom-select-option {
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      color: #f1f5f9;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .custom-select-option:hover {
      background: #334155;
    }
    .custom-select-option.selected {
      background: #1e40af;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar Filters -->
    <aside class="w-64 bg-slate-850 border-r border-slate-700 flex flex-col">
      <div class="p-5 border-b border-slate-700">
        <h1 class="text-xl font-bold text-white">Plugin Library</h1>
        <p class="text-sm text-slate-400 mt-1"><span id="plugin-count">0</span> plugins</p>
      </div>
      
      <!-- Search -->
      <div class="p-4">
        <input 
          type="text" 
          id="search" 
          placeholder="Search plugins..." 
          class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 placeholder-slate-500"
        >
      </div>
      
      <!-- Filters -->
      <div class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-6">
        <!-- Vendor Filter -->
        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Vendor</h3>
          <div class="custom-select" id="vendor-filter">
            <div class="custom-select-trigger">
              <span>All Vendors</span>
              <div class="custom-select-arrow"></div>
            </div>
            <div class="custom-select-options"></div>
          </div>
        </div>

        <!-- Category Filter -->
        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Category</h3>
          <div class="custom-select" id="category-filter">
            <div class="custom-select-trigger">
              <span>All Categories</span>
              <div class="custom-select-arrow"></div>
            </div>
            <div class="custom-select-options"></div>
          </div>
        </div>

        <!-- Type Filter -->
        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Type</h3>
          <div class="custom-select" id="type-filter">
            <div class="custom-select-trigger">
              <span>All Types</span>
              <div class="custom-select-arrow"></div>
            </div>
            <div class="custom-select-options"></div>
          </div>
        </div>
        
        <!-- Status Filter -->
        <div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Status</h3>
          <div class="space-y-2">
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" id="show-incompatible" checked class="rounded bg-slate-700 border-slate-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-0">
              <span>Show incompatible</span>
            </label>
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" id="show-unread-only" class="rounded bg-slate-700 border-slate-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-0">
              <span>Unread manuals only</span>
            </label>
            <label class="flex items-center gap-2 text-sm cursor-pointer">
              <input type="checkbox" id="show-researched-only" class="rounded bg-slate-700 border-slate-600 text-blue-500 focus:ring-blue-500 focus:ring-offset-0">
              <span>Researched only</span>
            </label>
          </div>
        </div>
      </div>
      
      <!-- Save Button -->
      <div class="p-4 border-t border-slate-700">
        <button 
          id="save-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors"
        >
          Save Changes
        </button>
        <p class="text-xs text-slate-500 mt-2 text-center">Downloads updated JSON</p>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
      <!-- Plugin Grid -->
      <div class="flex-1 overflow-y-auto scrollbar-thin p-6">
        <div id="plugin-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          <!-- Cards inserted here -->
        </div>
        <div id="no-results" class="hidden text-center py-12 text-slate-500">
          No plugins match your filters
        </div>
      </div>
      
      <!-- Detail Panel -->
      <div id="detail-panel" class="w-96 bg-slate-850 border-l border-slate-700 overflow-y-auto scrollbar-thin hidden">
        <div class="p-6">
          <div class="flex items-start justify-between mb-4">
            <div>
              <h2 id="detail-name" class="text-xl font-bold text-white"></h2>
              <p id="detail-vendor" class="text-slate-400"></p>
            </div>
            <button id="close-detail" class="text-slate-500 hover:text-white p-1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          
          <!-- Tags -->
          <div id="detail-tags" class="flex flex-wrap gap-2 mb-6"></div>
          
          <!-- Compatibility Warning -->
          <div id="detail-incompatible" class="hidden bg-amber-900/30 border border-amber-700 rounded-lg p-3 mb-6">
            <p class="text-amber-200 text-sm">⚠️ Not compatible with Apple Silicon</p>
          </div>
          
          <!-- Links -->
          <div id="detail-links" class="space-y-2 mb-6"></div>
          
          <!-- Manual Read Status -->
          <div id="detail-manual-section" class="mb-6 hidden">
            <label class="flex items-center gap-3 cursor-pointer p-3 bg-slate-800 rounded-lg hover:bg-slate-750 transition-colors">
              <input type="checkbox" id="detail-manual-read" class="rounded bg-slate-700 border-slate-600 text-green-500 focus:ring-green-500 focus:ring-offset-0 w-5 h-5">
              <span class="text-sm">I've read the manual</span>
            </label>
          </div>
          
          <!-- Description -->
          <div id="detail-description-section" class="mb-6 hidden">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Description</h3>
            <p id="detail-description" class="text-sm text-slate-300 leading-relaxed"></p>
          </div>
          
          <!-- Use Cases -->
          <div id="detail-usecases-section" class="mb-6 hidden">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Common Use Cases</h3>
            <ul id="detail-usecases" class="space-y-2"></ul>
          </div>
          
          <!-- Things to Try -->
          <div id="detail-totry-section" class="mb-6 hidden">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Things to Try</h3>
            <ul id="detail-totry" class="space-y-2"></ul>
          </div>
          
          <!-- Variant Info -->
          <div id="detail-variants-section" class="mb-6 hidden">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Related Variants</h3>
            <div id="detail-variants" class="space-y-2"></div>
          </div>
          
          <!-- Notes -->
          <div id="detail-notes-section" class="hidden">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Notes</h3>
            <p id="detail-notes" class="text-sm text-slate-300"></p>
          </div>
        </div>
      </div>
    </main>
  </div>

ass filters with zero latency. Each band can compress, expand, or gate specific frequencies. Powerful tool for surgical problem-solving and creative tone shaping.","useCases":["De-essing vocals without affecting overall tone","Taming harsh guitar frequencies dynamically","Adding density and punch to mix bus","Removing resonances and room modes from recordings"],"thingsToTry":["Set a band around 6-8kHz with compression to automatically tame sibilance on vocals","Use dynamic low-mid cut (200-400Hz) on guitars when bass enters - automatic frequency ducking","Try upward expansion on drum overheads to make cymbals sparkle without boosting overall level","Target specific harsh frequencies on distorted guitars and compress only when they get loud"],"notes":null,"variantGroup":null},{"id":"ujam-fin-retro","name":"FIN-RETRO","vendor":"UJAM","type":"effect","category":"creative-fx","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null},{"id":"ujam-usynth","name":"USYNTH","vendor":"UJAM","type":"instrument","category":"synthesizer","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null},{"id":"ujam-vb-dandy","name":"VB-DANDY","vendor":"UJAM","type":"instrument","category":"bass","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null},{"id":"ujam-vd-deep","name":"VD-DEEP","vendor":"UJAM","type":"instrument","category":"drums","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null},{"id":"uad-1176-rev-a","name":"1176 Rev A Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419447352980-UA-1176-Classic-Limiter-Collection-Manual","productUrl":"https://www.uaudio.com/products/1176-collection","description":"The original \"Bluestripe\" 1176 FET compressor known for aggressive, colorful compression with higher distortion and unique amplifier characteristics. Ultra-fast attack (20 microseconds) makes it perfect for taming transients while adding punch and attitude.","useCases":["Aggressive vocal compression with attitude and presence","Punchy drum room mics and overheads","Bass guitar DI tracking for controlled, energetic low end","Distorted guitar taming while maintaining aggression"],"thingsToTry":["Try the famous \"All-Button\" mode (all ratios engaged) on drums for an overdriven, slamming sound - perfect for Queens-era rock drums","Use 4:1 ratio with fast attack/release on your lead vocals for in-your-face Peter Gabriel-style presence","Slam bass DI hard (8:1 or higher) before re-amping for tight, controlled foundation","Moderate settings (4:1, medium attack) on guitar bus to glue layers together without killing dynamics"],"variantGroup":"1176","notes":null},{"id":"uad-1176ae","name":"1176AE Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419447352980-UA-1176-Classic-Limiter-Collection-Manual","productUrl":"https://www.uaudio.com/products/1176-collection","description":"Anniversary Edition with exclusive hot-rod mods including 2:1 ratio (borrowed from the 176) and a super-slow 10ms attack mode. Revisits the program-dependent release of the Rev A but with additional versatility and a more complex, full sound.","useCases":["Subtle vocal leveling with warmth and fullness","Mix bus compression with gentle ratio settings","Acoustic instruments needing gentle control","Background vocals and harmonies"],"thingsToTry":["Use 2:1 ratio for transparent mix bus glue - lets the mix breathe while adding cohesion","Try the slow attack mode on vocals for natural dynamics with gentle peak control","Great on the stereo drum bus with 4:1 for controlled energy without pumping","Experiment with multi-button combos for creative parallel compression textures"],"variantGroup":"1176","notes":null},{"id":"uad-1176ln-rev-e","name":"1176LN Rev E Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419447352980-UA-1176-Classic-Limiter-Collection-Manual","productUrl":"https://www.uaudio.com/products/1176-collection","description":"Early 70s \"Low Noise\" 1176 with more linear compression response, transistor gain amplification, and lower distortion than Rev A. More refined and transparent while maintaining the 1176 character. The most versatile of the three variants.","useCases":["Transparent vocal compression for modern productions","Clean bass compression that stays out of the way","Mix bus compression with minimal coloration","Parallel compression for subtle thickness"],"thingsToTry":["Use on bass guitar with 4:1, medium-fast attack for transparent low-end control","Try as a clean mix bus compressor (2:1-4:1) for gentle glue without obvious pumping","Perfect for modern vocal production when you want control without obvious compression artifacts","Use in parallel (50% mix) on drums for thickness without losing natural transients"],"variantGroup":"1176","notes":null},{"id":"uad-api-2500","name":"API 2500 Bus Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419505673620-API-2500-Bus-Compressor-Manual","productUrl":"https://www.uaudio.com/products/api-2500-bus-compressor","description":"Legendary VCA bus compressor with all-discrete signal path. Features API's patented Thrust circuit for punch, three compression knees (Soft/Medium/Hard), and \"Old\" vs \"New\" compression types (feedback vs feed-forward). Includes precise L/R Link control and plugin-exclusive Mix/Headroom controls.","useCases":["Mix bus compression for glue and energy","Drum bus crushing with extreme Thrust settings","Subgroup compression on guitars or vocals","Parallel compression with Mix control"],"thingsToTry":["Use Thrust on \"Loud\" mode with drum bus for punchy, midrange-forward sound that sits on top of the mix","Try \"Old\" (feedback) mode on vocals for smoother, more characterful compression with less aggression","Set Mix to 50% for instant parallel compression - push Ratio hard for aggressive punch blended with clean signal","Use Soft knee with medium ratio (3:1) on mix bus for transparent glue - API character without heavy-handed compression"],"notes":null},{"id":"uad-brigade-chorus","name":"Brigade Chorus","vendor":"Universal Audio","type":"effect","category":"modulation","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/7360583462036-Brigade-Chorus-Manual","productUrl":"https://www.uaudio.com/products/brigade-chorus","description":"Exhaustive emulation of the BOSS CE-1 Chorus Ensemble (1976), the first commercial chorus pedal. Features authentic bucket-brigade circuit for warm, organic chorus and chewy vibrato. Includes Classic mode (original behavior) and plugin-only Dual mode for immersive stereo spread.","useCases":["Classic 80s chorus on guitars (Rush, The Police, The Cure)","Adding width and shimmer to vocals, drums, and synths","Fender Rhodes and electric piano enhancement","Bass guitar texture (New Order style)"],"thingsToTry":["Chorus mode on clean electric guitars for that classic late-70s/80s shimmer - instant Rush/Andy Summers vibe","Use Dual mode on stereo synth or Rhodes for maximum left/right spread beyond what hardware could do","Try vibrato mode on lead vocals for subtle pitch warble that adds character","Gentle chorus on drum overheads for width and haze without overwhelming the mix"],"notes":null},{"id":"uad-century-tube-channel-strip","name":"Century Tube Channel Strip","vendor":"Universal Audio","type":"effect","category":"channel-strip","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/11912560531860-Century-Tube-Channel-Strip-Manual","productUrl":"https://www.uaudio.com/products/century-tube-channel-strip","description":"Simplified \"do-no-harm\" vintage-inspired tube channel strip with modular signal flow. Features tube mic preamp (Low/High gain modes), 3-band EQ (fixed shelving at 110Hz/10kHz, sweepable mid 300Hz-7.2kHz), single-knob optical compressor with auto-makeup gain. Designed for easy, foolproof tracking and mixing.","useCases":["Quick, musical tracking setup for vocals and instruments","Adding tube warmth and character to digital sources","Simple mix channel strip for bass, guitar, vocals","Foolproof compression and EQ for beginners"],"thingsToTry":["Use High gain mode on dynamic/ribbon mics for extra tube saturation - great for aggressive rock vocals","Push the tube preamp into distortion for warm breakup on DI bass or guitars","Single-knob opto compressor is faster than LA-2A - perfect for adding energy to acoustic guitars or controlling bass","Try on drum bus for smooth, \"glued\" sound with broad-stroke EQ to shape overall kit tone"],"notes":null},{"id":"uad-electra-88","name":"Electra 88 Vintage Keys","vendor":"Universal Audio","type":"instrument","category":"keys","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null},{"id":"uad-galaxy-tape-echo","name":"Galaxy Tape Echo","vendor":"Universal Audio","type":"effect","category":"delay","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419513003668-Galaxy-Tape-Echo-Manual","productUrl":"https://www.uaudio.com/products/galaxy-tape-echo","description":"Exhaustive emulation of the Roland RE-201 Space Echo tape delay and spring reverb unit. Features multi-head tape delays with authentic wow/flutter, pitch shifting, distortion, and wild self-oscillation capabilities. Includes modern additions like tempo sync and tape selection.","useCases":["Dub-style delays and psychedelic textures on vocals and guitars","Rockabilly slapback to ambient delay washes","Adding analog warmth and movement to drums and synths","Creative sound design with self-oscillation effects"],"thingsToTry":["Use multi-head mode (Mode 11 or 12) with moderate feedback for rhythmic, cascading delays on lead guitar - classic post-punk/NIN territory","Push the Intensity control high and let it self-oscillate for runaway sci-fi textures on breakdowns","Try the spring reverb on snare for authentic 70s dub character","Use tempo sync for locked-in delays, then add spring reverb for dimensional depth on synth pads"],"notes":null},{"id":"uad-helios-type-69","name":"Helios Type 69 Preamp and EQ","vendor":"Universal Audio","type":"effect","category":"channel-strip","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/18737805108500-Helios-Type-69-Preamp-EQ-Collection-Manual","productUrl":"https://www.uaudio.com/products/helios-type-69-preamp-eq","description":"Classic British console channel from Olympic Studios era. Features \"triple amp\" feedback-style 70dB preamp with Lustraphone transformer, and inductor-based 3-band passive EQ. Known for assertive midrange, punchy character, and ability to sound musical even at extreme EQ settings.","useCases":["Adding British rock attitude to guitars and vocals","Aggressive EQ moves that stay musical","Bass guitar with solid, wide low-end foundation","Drums with punchy midrange presence"],"thingsToTry":["Use the mid-band peaked at 2-3kHz on guitars for cutting, aggressive rock tone - the inductor saturation keeps it musical","Try the bass boost at 100Hz on kick and bass guitar for that classic LED Zeppelin/Sabbath low-end punch","Push the preamp gain hard (60-70dB) on DI sources for colorful analog weight and slight compression","Use the fixed 50Hz low-cut mode on overheads to clean up drum sound while keeping top-end aggression"],"notes":null},{"id":"uad-la-2","name":"LA-2 Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419496124180-Teletronix-LA-2A-Leveler-Collection-Manual","productUrl":"https://www.uaudio.com/products/teletronix-la-2a-collection","description":"The rare early-1960s optical tube compressor that preceded the LA-2A. Features the slowest response time and a uniquely \"mellowed\" sound from 50+ years of luminescent panel aging in the T4 module. Most transparent and gentle of the three variants.","useCases":["Smooth, transparent vocal leveling on ballads","Gentle bass compression for sustained notes","Acoustic instruments needing subtle dynamics control","Sources with slow, legato phrasing"],"thingsToTry":["Perfect for emotional, slow-tempo vocal performances - lets subtle dynamics through","Use on fretless or upright bass for musical, breathing compression","Try on ambient pads or sustained synths for gentle glue","Great for acoustic guitar fingerpicking where you want natural dynamics preserved"],"variantGroup":"LA-2A","notes":null},{"id":"uad-la-2a-gray","name":"LA-2A Gray Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419496124180-Teletronix-LA-2A-Leveler-Collection-Manual","productUrl":"https://www.uaudio.com/products/teletronix-la-2a-collection","description":"Jim Lawrence's original mid-1960s design with medium-speed compression and average time constant. Known for warmth and sublime smoothness. Less severe saturation than Silver, with a thick, warm character that's less in-your-face.","useCases":["Warm, thick vocal compression with body","Bass guitar with vintage tube warmth","Smooth, radio-ready mixes on the stereo bus","Adding analog color to digital sources"],"thingsToTry":["Use on bass guitar with moderate peak reduction for that warm, vintage thump - perfect for rock bass","Try on lead vocals when you want warmth and body over transparent control","Great for adding tube saturation character to DI'd instruments","Use light settings just for tube color without heavy compression"],"variantGroup":"LA-2A","notes":null},{"id":"uad-la-2a-silver","name":"LA-2A Silver Compressor","vendor":"Universal Audio","type":"effect","category":"compressor","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419496124180-Teletronix-LA-2A-Leveler-Collection-Manual","productUrl":"https://www.uaudio.com/products/teletronix-la-2a-collection","description":"Late-1960s version manufactured by Bill Putnam - the most popular LA-2A variant. Fastest time constant makes it versatile for wide range of sources including drums and percussion. Punchy, transparent, and immediate with a bright, modern sheen.","useCases":["Professional vocal compression - the go-to in studios worldwide","Drum room mics and overheads","Bass guitar for controlled, punchy low end","Mix bus compression for polished, radio-ready sound"],"thingsToTry":["The classic vocal compressor - use moderate peak reduction for controlled, present vocals that sit perfectly in rock mixes","Try on drum overheads (limit mode) to tame cymbals while keeping punch","Use on stereo synth parts for optical glue with minimal pumping","Great on the mix bus with light settings (3-5 dB GR) for final polish"],"variantGroup":"LA-2A","notes":null},{"id":"uad-moog-minimoog","name":"Moog Minimoog Synth","vendor":"Universal Audio","type":"instrument","category":"synthesizer","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/360041479272-Moog-Minimoog-Manual","productUrl":"https://www.uaudio.com/products/moog-minimoog","description":"Official Moog-endorsed emulation of the legendary Minimoog Model D monophonic synthesizer. Features painstaking circuit modeling of the famous Moog ladder filter, oscillators, and all module-to-module coupling. Includes custom mods like legato, extra LFO, and sample & hold.","useCases":["Fat, punchy bass lines with signature Moog low-end","Soaring lead synth lines with expressive pitch/mod wheels","Thick pads using oscillator detuning and ensemble","Experimental sound design with extreme resonance and self-oscillation"],"thingsToTry":["Classic Moog bass: use oscillators 1+3 with filter slightly open, moderate resonance - instant Parliament/Stevie Wonder bass","Try the \"feedback\" mod (routing output to input) for varying degrees of distortion on leads","Push resonance to maximum and use keyboard tracking for screaming, self-oscillating leads - great for industrial/NIN-style sounds","Layer all 3 oscillators slightly detuned with the ensemble feature for massive, wide pad sounds"],"notes":null},{"id":"uad-opal-morphing-synth","name":"Opal Morphing Synth","vendor":"Universal Audio","type":"instrument","category":"synthesizer","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4421163605908-Opal-Morphing-Synthesizer-Manual","productUrl":"https://www.uaudio.com/products/opal-morphing-synthesizer","description":"UA's flagship analog-meets-wavetable super synth with morphing oscillators, filters, and LFOs. Features 91 curated wavetables, FM/AM synthesis, two morphing filters, and built-in UA effects including authentic 1176 compression, reverb, and tape delay.","useCases":["Modern, evolving pad sounds with wavetable morphing","Aggressive lead synths with FM and wavetable combinations","Atmospheric soundscapes and textures for cinematic production","Bass synth with analog character and wavetable punch"],"thingsToTry":["Use the morphing filter sweep (low-pass through band-pass to high-pass) as a modulation destination for evolving textures","Layer analog oscillators with wavetables - analog warmth with digital edge for modern rock synth tones","Try the built-in 1176 compression on bass patches for instant punch and presence","Experiment with the Multi-Seg envelope for complex, rhythmic modulations - great for aggressive, gated synth parts"],"notes":null},{"id":"uad-oxide-tape-recorder","name":"Oxide Tape Recorder","vendor":"Universal Audio","type":"effect","category":"tape","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/11914703390740-Oxide-Tape-Recorder-Manual","productUrl":"https://www.uaudio.com/products/oxide-tape-recorder","description":"Simplified tape saturation plugin from the team behind UA's Ampex and Studer emulations. Features essential controls: tape speed (7.5/15 IPS), emphasis curves, noise reduction, and Input/Output. Adds warmth, punch, and cohesive \"glue\" with fat tape compression.","useCases":["Adding analog warmth and character to individual tracks","Tape saturation on drums for punch and cohesion","Injecting presence into vocals and guitars","Subtle tape glue on mix bus for analog feel"],"thingsToTry":["Use 15 IPS, CCIR curve on individual drum tracks for clean warmth, then slam the mix bus harder for glue","Try Input mode (circuit only, no tape) for subtle analog color without heavy saturation","Push vocals into the red on the VU meter for aggressive tape compression and bite - great for rock vocals","Use 7.5 IPS for more pronounced \"head bump\" bass enhancement on bass guitar or kick drum"],"notes":null},{"id":"uad-polymax-synth","name":"PolyMAX Synth","vendor":"Universal Audio","type":"instrument","category":"synthesizer","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/10207494851220-PolyMAX-Synth-Manual","productUrl":"https://www.uaudio.com/products/polymax-synth","description":"Vintage-inspired polyphonic synthesizer modeled after the golden age of analog polysynths (Jupiters, Oberheims, Prophets). Features warm analog-modeled oscillators, filters, and built-in UA effects like spring reverb, tape delay, and modulation.","useCases":["Lush pad sounds for atmospheric rock and cinematic moments","Punchy lead synth lines with analog warmth","Retro 80s-style stabs and poly textures","Bass synth parts that sit perfectly in a dense mix"],"thingsToTry":["Use Unison mode with detuning for instant width on pads - great for filling space in solo artist productions","Try the built-in tape delay on lead patches for NIN/industrial-style synth parts","Experiment with linear FM for aggressive, in-tune modulation textures","Use the arpeggiator with Voice Panning enabled for moving, evolving patterns"],"notes":null},{"id":"uad-pultec-eqp-1a","name":"Pultec EQP-1A EQ","vendor":"Universal Audio","type":"effect","category":"eq","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/7183176266260-Pultec-Passive-EQ-Collection-Manual","productUrl":"https://www.uaudio.com/products/pultec-passive-eq-collection","description":"Legendary passive tube EQ famous for its low-end shelving and high-frequency boost. Can simultaneously boost and cut the same bass frequency (actually affecting adjacent frequencies) creating a unique resonant dip that tightens and enhances lows.","useCases":["Tightening and enhancing kick drum and bass guitar","Adding air and presence to vocals and mix bus","Smooth high-frequency enhancement without harshness","Low-end sculpting with musical character"],"thingsToTry":["The famous Pultec bass trick: boost and cut at the same frequency (e.g., 60Hz) on kick drum for tight, punchy low end","Use the 16kHz boost on your mix bus to add silky air without brittleness","Try gentle high boost on vocals for presence without sibilance issues","Experiment with the bandwidth control on high freq boost - narrow for surgical, wide for smooth"],"variantGroup":"Pultec","notes":null},{"id":"uad-pultec-hlf-3c","name":"Pultec HLF-3C EQ","vendor":"Universal Audio","type":"effect","category":"eq","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/7183176266260-Pultec-Passive-EQ-Collection-Manual","productUrl":"https://www.uaudio.com/products/pultec-passive-eq-collection","description":"High and low-pass filter unit with 12dB/octave slopes. Simple two-control design for broad tonal sculpting or creative lo-fi effects. Removes the insertion loss found in the passive hardware by including tube amplification in the plugin.","useCases":["Removing low-end rumble and high-end hiss","Creating lo-fi or telephone-style effects","Taming excessive bass or brightness","Vintage filter sweeps for creative effects"],"thingsToTry":["Use high-pass at 100-200Hz on guitars to make room for bass and kick in the mix","Create lo-fi vocal effects by cutting lows below 300Hz and highs above 5kHz","Try on drum overheads: high-pass at 200Hz to remove kick/tom bleed while keeping cymbals clear","Experiment with dramatic filtering for breakdown sections or transition effects"],"variantGroup":"Pultec","notes":null},{"id":"uad-pultec-meq-5","name":"Pultec MEQ-5 EQ","vendor":"Universal Audio","type":"effect","category":"eq","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/7183176266260-Pultec-Passive-EQ-Collection-Manual","productUrl":"https://www.uaudio.com/products/pultec-passive-eq-collection","description":"Tube-amplified midrange companion to the EQP-1A. Features two boost bands and one dip band focused on the critical \"power region\" (200Hz-5kHz). Unique overlapping frequency ranges and filter interactions bring out vibrancy in guitars and vocals.","useCases":["Adding presence and clarity to vocals","Sculpting guitar tones in the mix","Reducing boxiness or muddiness in midrange","Enhancing warmth and body without low-end boom"],"thingsToTry":["Boost 3-5kHz and dip 300-500Hz on vocals for clarity and presence without boxiness","Try boosting 1-2kHz on rhythm guitars to help them cut through dense mixes","Use the dip at 1kHz to reduce harshness on aggressive distorted guitars","Experiment on bass: boost 700Hz-1kHz for growl, dip 300Hz if too boomy"],"variantGroup":"Pultec","notes":null},{"id":"uad-pure-plate-reverb","name":"Pure Plate Reverb","vendor":"Universal Audio","type":"effect","category":"reverb","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4419497304340-Pure-Plate-Reverb-Manual","productUrl":"https://www.uaudio.com/products/pure-plate-reverb","description":"Streamlined plate reverb emulation capturing the steel plate, transducers, and mechanical dampers of classic hardware. Features colorful Baxandall-type tone controls for sculpting reverb character. Simpler than UA's EMT 140 with focus on essential, musical controls.","useCases":["Natural depth and shimmer on lead vocals","Adding dimension to drums without overwhelming the mix","Gluing guitar layers together with rich ambience","Warm reverb on synths and keys"],"thingsToTry":["Use moderate decay (2-3 seconds) with bass boost on lead vocals for lush, present vocal space","Try well-damped settings (shorter decay) with pre-delay on drums for punch with dimension","Low-cut at 90Hz on full mixes to keep low end tight while adding air on top","Experiment with the Balance control to position reverb off-center for width without washing out the center channel"],"notes":null},{"id":"uad-ravel-grand-piano","name":"Ravel Grand Piano","vendor":"Universal Audio","type":"instrument","category":"keys","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/360041911111-Ravel-Grand-Piano-Manual","productUrl":"https://www.uaudio.com/products/ravel","description":"Breathtaking emulation of a Steinway Model B grand piano using physical modeling and UltraResonance technology. Recorded at United Recording Studios by Allen Sides with vintage mics. Features sympathetic string resonance, close/room mic blend, unique reverse piano fea ,"Use on background vocals as a substitute for doubling - adds width and gel without obvious chorusing","Subtle Mode 1 or 2 on bass guitar for fatness without losing definition","Experiment with multiple button combinations (shift+click) for unique widening variations"],"notes":null},{"id":"uad-verve-analog-machines","name":"Verve Analog Machines Essentials","vendor":"Universal Audio","type":"effect","category":"saturation","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/25190283956500-Verve-Analog-Machines-Manual","productUrl":"https://www.uaudio.com/products/verve-analog-machines","description":"Collection of 10 \"retro-futuristic\" analog tone machines for coloration and saturation. Not based on specific hardware - generic modeled devices offering assorted analog flavors from tape machines (varying fidelity) and preamps (tube/solid-state). Simple controls: Drive, Tone/Warble, Output.","useCases":["Adding analog warmth and character to digital/software instruments","Lo-fi/hip-hop production aesthetic","Aggressive distortion and saturation on drums and synths","Quick analog vibe without deep menu diving"],"thingsToTry":["Try \"Glow\" or \"Sweeten\" on digital synths for instant analog warmth without heavy distortion","Use \"Fire\" or \"Overdrive\" on kicks and snares for aggressive, saturated punch - great for hip-hop/electronic","Experiment with \"Sputter\" (solid-state preamp) on vocals for gentle-to-extreme breakup - huge range in the Drive control","Put \"Thicken\" or \"Vintagize\" on mix bus at low settings for subtle lo-fi/tape character across entire mix"],"notes":null},{"id":"uad-waterfall-b3-organ","name":"Waterfall B3 Organ","vendor":"Universal Audio","type":"instrument","category":"keys","compatible":true,"manualRead":false,"manualUrl":"https://help.uaudio.com/hc/en-us/articles/4421163858836-Waterfall-B3-Organ-Manual","productUrl":"https://www.uaudio.com/products/waterfall-b3","description":"Comprehensive emulation of a 1958 Hammond B3 tonewheel organ with Leslie 147 rotary speaker cabinet. Features complete circuit modeling of tube power amp saturation, transformer \"pumping,\" drawbar interactions, and three-dimensional rotary speaker with vintage mic positions. Includes 70+ presets and spring reverb.","useCases":["Soul, gospel, and R&B organ parts","Classic rock organ tones with Leslie swirl","Jazz organ comping and leads","Hip-hop and modern productions with vintage organ character"],"thingsToTry":["Classic rock organ: drawbars at 888000000 with fast Leslie speed for that Deep Purple/Led Zeppelin swirl","Use the spring reverb on slower Leslie settings for dreamy, atmospheric pad sounds","Try the swell pedal (MIDI CC #11) for dynamic expression - it attenuates mids more than highs/lows for a natural \"smiley\" curve","Keyboard split mode lets you play bass pedal tones on lower keys while comping on upper keys with one controller"],"notes":null},{"id":"uad-waterfall-rotary-speaker","name":"Waterfall Rotary Speaker","vendor":"Universal Audio","type":"MIDI-controlled effect","category":"modulation","compatible":true,"manualRead":false,"manualUrl":null,"productUrl":null,"description":null,"useCases":[],"thingsToTry":[],"notes":null}],"categories":{"amp-sim":"Amp Simulation","bass":"Bass","channel-strip":"Channel Strip","compressor":"Compressor","creative-fx":"Creative FX","delay":"Delay","drums":"Drums","eq":"EQ","exciter":"Exciter","filter":"Filter","keys":"Keys","mastering":"Mastering","metering":"Metering","mixing-bundle":"Mixing Bundle","modulation":"Modulation","monitoring":"Monitoring","multi-instrument":"Multi-Instrument","noise-reduction":"Noise Reduction","panning":"Panning","pitch-correction":"Pitch Correction","reverb":"Reverb","sampler":"Sampler","saturation":"Saturation","stereo-imaging":"Stereo Imaging","synthesizer":"Synthesizer","tape":"Tape","utility":"Utility"},"lastUpdated":"2025-12-20"};
    
    let pluginData = JSON.parse(JSON.stringify(PLUGIN_DATA));
    let selectedPlugin = null;
    let hasChanges = false;

    // Category colors
    const categoryColors = {
      'compressor': 'bg-purple-900/50 text-purple-300 border-purple-700',
      'eq': 'bg-blue-900/50 text-blue-300 border-blue-700',
      'reverb': 'bg-cyan-900/50 text-cyan-300 border-cyan-700',
      'delay': 'bg-teal-900/50 text-teal-300 border-teal-700',
      'saturation': 'bg-orange-900/50 text-orange-300 border-orange-700',
      'amp-sim': 'bg-red-900/50 text-red-300 border-red-700',
      'modulation': 'bg-pink-900/50 text-pink-300 border-pink-700',
      'synthesizer': 'bg-violet-900/50 text-violet-300 border-violet-700',
      'keys': 'bg-indigo-900/50 text-indigo-300 border-indigo-700',
      'drums': 'bg-amber-900/50 text-amber-300 border-amber-700',
      'bass': 'bg-emerald-900/50 text-emerald-300 border-emerald-700',
      'default': 'bg-slate-700/50 text-slate-300 border-slate-600'
    };

    function getCategoryColor(category) {
      return categoryColors[category] || categoryColors.default;
    }

    function loadPlugins() {
      // Data is already embedded, just initialize
      initializeFilters();
      renderPlugins();
    }

    // Custom Select Implementation
    const customSelects = {};

    function createCustomSelect(id, options, defaultLabel) {
      const selectEl = document.getElementById(id);
      const trigger = selectEl.querySelector('.custom-select-trigger span');
      const optionsEl = selectEl.querySelector('.custom-select-options');
      const triggerBtn = selectEl.querySelector('.custom-select-trigger');

      // Create options
      const allOptions = [{ value: '', label: defaultLabel }, ...options];
      optionsEl.innerHTML = allOptions.map(opt =>
        `<div class="custom-select-option" data-value="${opt.value}">${opt.label}</div>`
      ).join('');

      // State
      customSelects[id] = { value: '', label: defaultLabel };

      // Toggle dropdown
      triggerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = optionsEl.classList.contains('open');
        closeAllSelects();
        if (!isOpen) {
          triggerBtn.classList.add('open');
          optionsEl.classList.add('open');
        }
      });

      // Option selection
      optionsEl.querySelectorAll('.custom-select-option').forEach(option => {
        option.addEventListener('click', () => {
          const value = option.dataset.value;
          const label = option.textContent;
          customSelects[id] = { value, label };
          trigger.textContent = label;

          // Update selected state
          optionsEl.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');

          // Close and trigger change
          closeAllSelects();
          renderPlugins();
        });
      });
    }

    function closeAllSelects() {
      document.querySelectorAll('.custom-select-trigger').forEach(t => t.classList.remove('open'));
      document.querySelectorAll('.custom-select-options').forEach(o => o.classList.remove('open'));
    }

    // Close on outside click
    document.addEventListener('click', () => {
      closeAllSelects();
    });

    function initializeFilters() {
      const vendors = [...new Set(pluginData.plugins.map(p => p.vendor))].sort();
      const categories = [...new Set(pluginData.plugins.map(p => p.category))].sort();
      const types = [...new Set(pluginData.plugins.map(p => p.type))].sort();

      createCustomSelect('vendor-filter',
        vendors.map(v => ({ value: v, label: v })),
        'All Vendors'
      );

      createCustomSelect('category-filter',
        categories.map(c => ({ value: c, label: pluginData.categories[c] || c })),
        'All Categories'
      );

      createCustomSelect('type-filter',
        types.map(t => ({ value: t, label: t })),
        'All Types'
      );
    }

    function getFilteredPlugins() {
      const search = document.getElementById('search').value.toLowerCase();
      const vendor = customSelects['vendor-filter']?.value || '';
      const category = customSelects['category-filter']?.value || '';
      const type = customSelects['type-filter']?.value || '';
      const showIncompatible = document.getElementById('show-incompatible').checked;
      const showUnreadOnly = document.getElementById('show-unread-only').checked;
      const showResearchedOnly = document.getElementById('show-researched-only').checked;

      return pluginData.plugins.filter(p => {
        if (search && !p.name.toLowerCase().includes(search) && !p.vendor.toLowerCase().includes(search)) return false;
        if (vendor && p.vendor !== vendor) return false;
        if (category && p.category !== category) return false;
        if (type && p.type !== type) return false;
        if (!showIncompatible && !p.compatible) return false;
        if (showUnreadOnly && p.manualRead) return false;
        if (showResearchedOnly && !p.description) return false;
        return true;
      });
    }

    function renderPlugins() {
      const filtered = getFilteredPlugins();
      const grid = document.getElementById('plugin-grid');
      const noResults = document.getElementById('no-results');

      document.getElementById('plugin-count').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      
      grid.innerHTML = filtered.map(plugin => {
        const hasResearch = plugin.description || plugin.useCases.length > 0;
        const categoryLabel = pluginData.categories[plugin.category] || plugin.category;
        const colorClass = getCategoryColor(plugin.category);
        
        return `
          <div 
            class="plugin-card bg-slate-800 rounded-xl p-4 cursor-pointer border border-slate-700 hover:border-slate-500 ${!plugin.compatible ? 'opacity-60' : ''} ${selectedPlugin?.id === plugin.id ? 'ring-2 ring-blue-500' : ''}"
            data-id="${plugin.id}"
          >
            <div class="flex items-start justify-between mb-3">
              <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-white truncate">${plugin.name}</h3>
                <p class="text-sm text-slate-400">${plugin.vendor}</p>
              </div>
              ${plugin.manualRead ? '<span class="text-green-400 text-lg" title="Manual read">✓</span>' : ''}
            </div>
            <div class="flex flex-wrap gap-1.5">
              <span class="tag text-xs px-2 py-0.5 rounded-full border ${colorClass}">${categoryLabel}</span>
              ${!plugin.compatible ? '<span class="tag text-xs px-2 py-0.5 rounded-full border bg-amber-900/50 text-amber-300 border-amber-700">Incompatible</span>' : ''}
              ${hasResearch ? '<span class="tag text-xs px-2 py-0.5 rounded-full border bg-green-900/50 text-green-300 border-green-700">Researched</span>' : ''}
            </div>
          </div>
        `;
      }).join('');

      // Add click handlers
      grid.querySelectorAll('.plugin-card').forEach(card => {
        card.addEventListener('click', () => {
          const plugin = pluginData.plugins.find(p => p.id === card.dataset.id);
          showDetail(plugin);
        });
      });
    }

    function showDetail(plugin) {
      selectedPlugin = plugin;
      const panel = document.getElementById('detail-panel');
      panel.classList.remove('hidden');

      document.getElementById('detail-name').textContent = plugin.name;
      document.getElementById('detail-vendor').textContent = plugin.vendor;

      // Tags
      const categoryLabel = pluginData.categories[plugin.category] || plugin.category;
      const colorClass = getCategoryColor(plugin.category);
      document.getElementById('detail-tags').innerHTML = `
        <span class="tag text-xs px-2 py-1 rounded-full border ${colorClass}">${categoryLabel}</span>
        <span class="tag text-xs px-2 py-1 rounded-full border bg-slate-700/50 text-slate-300 border-slate-600">${plugin.type}</span>
      `;

      // Compatibility warning
      const incompatibleEl = document.getElementById('detail-incompatible');
      if (!plugin.compatible) {
        incompatibleEl.classList.remove('hidden');
      } else {
        incompatibleEl.classList.add('hidden');
      }

      // Links
      const linksEl = document.getElementById('detail-links');
      let linksHtml = '';
      if (plugin.productUrl) {
        linksHtml += `<a href="${plugin.productUrl}" target="_blank" class="flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          Product Page
        </a>`;
      }
      if (plugin.manualUrl) {
        linksHtml += `<a href="${plugin.manualUrl}" target="_blank" class="flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Manual
        </a>`;
      }
      if (!linksHtml) {
        linksHtml = '<p class="text-sm text-slate-500 italic">No links available yet</p>';
      }
      linksEl.innerHTML = linksHtml;

      // Manual read checkbox
      const manualSection = document.getElementById('detail-manual-section');
      const manualCheckbox = document.getElementById('detail-manual-read');
      if (plugin.manualUrl) {
        manualSection.classList.remove('hidden');
        manualCheckbox.checked = plugin.manualRead;
        manualCheckbox.onchange = () => {
          plugin.manualRead = manualCheckbox.checked;
          hasChanges = true;
          renderPlugins();
        };
      } else {
        manualSection.classList.add('hidden');
      }

      // Description
      const descSection = document.getElementById('detail-description-section');
      const descEl = document.getElementById('detail-description');
      if (plugin.description) {
        descSection.classList.remove('hidden');
        descEl.textContent = plugin.description;
      } else {
        descSection.classList.add('hidden');
      }

      // Use Cases
      const usecasesSection = document.getElementById('detail-usecases-section');
      const usecasesEl = document.getElementById('detail-usecases');
      if (plugin.useCases && plugin.useCases.length > 0) {
        usecasesSection.classList.remove('hidden');
        usecasesEl.innerHTML = plugin.useCases.map(uc => 
          `<li class="text-sm text-slate-300 flex items-start gap-2">
            <span class="text-blue-400 mt-1">•</span>
            <span>${uc}</span>
          </li>`
        ).join('');
      } else {
        usecasesSection.classList.add('hidden');
      }

      // Things to Try
      const totrySection = document.getElementById('detail-totry-section');
      const totryEl = document.getElementById('detail-totry');
      if (plugin.thingsToTry && plugin.thingsToTry.length > 0) {
        totrySection.classList.remove('hidden');
        totryEl.innerHTML = plugin.thingsToTry.map(item => 
          `<li class="text-sm text-slate-300 flex items-start gap-2">
            <span class="text-green-400 mt-1">→</span>
            <span>${item}</span>
          </li>`
        ).join('');
      } else {
        totrySection.classList.add('hidden');
      }

      // Variants
      const variantsSection = document.getElementById('detail-variants-section');
      const variantsEl = document.getElementById('detail-variants');
      if (plugin.variantGroup) {
        const variants = pluginData.plugins.filter(p => 
          p.variantGroup === plugin.variantGroup && p.id !== plugin.id
        );
        if (variants.length > 0) {
          variantsSection.classList.remove('hidden');
          variantsEl.innerHTML = variants.map(v => 
            `<button class="w-full text-left p-2 bg-slate-800 rounded-lg hover:bg-slate-750 text-sm transition-colors variant-btn" data-id="${v.id}">
              <span class="text-white">${v.name}</span>
            </button>`
          ).join('');
          variantsEl.querySelectorAll('.variant-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const variant = pluginData.plugins.find(p => p.id === btn.dataset.id);
              showDetail(variant);
            });
          });
        } else {
          variantsSection.classList.add('hidden');
        }
      } else {
        variantsSection.classList.add('hidden');
      }

      // Notes
      const notesSection = document.getElementById('detail-notes-section');
      const notesEl = document.getElementById('detail-notes');
      if (plugin.notes) {
        notesSection.classList.remove('hidden');
        notesEl.textContent = plugin.notes;
      } else {
        notesSection.classList.add('hidden');
      }

      // Re-render to show selection
      renderPlugins();
    }

    function saveChanges() {
      const dataStr = JSON.stringify(pluginData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'plugins.json';
      a.click();
      URL.revokeObjectURL(url);
      hasChanges = false;
    }

    // Event listeners
    document.getElementById('search').addEventListener('input', renderPlugins);
    // Custom select change events are handled in createCustomSelect()
    document.getElementById('show-incompatible').addEventListener('change', renderPlugins);
    document.getElementById('show-unread-only').addEventListener('change', renderPlugins);
    document.getElementById('show-researched-only').addEventListener('change', renderPlugins);
    document.getElementById('save-btn').addEventListener('click', saveChanges);
    document.getElementById('close-detail').addEventListener('click', () => {
      selectedPlugin = null;
      document.getElementById('detail-panel').classList.add('hidden');
      renderPlugins();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        selectedPlugin = null;
        document.getElementById('detail-panel').classList.add('hidden');
        renderPlugins();
      }
      if (e.key === '/' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search').focus();
      }
    });

    // Warn before leaving with unsaved changes
    window.addEventListener('beforeunload', (e) => {
      if (hasChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // Load on start
    loadPlugins();
  </script>
